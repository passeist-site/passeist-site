[build]
  publish = "."
  functions = "netlify/functions"

[[plugins]]
  package = "./netlify/plugins/generate-product-pages"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Newsletter « nouvelles pièces » : vérification chaque jour à 9 h (heure de Paris, été)
[functions."newsletter-send"]
  schedule = "0 7 * * *"

# Notification « nouveautés de la semaine » : le vendredi à 18 h (heure de Paris, été)
[functions."push-weekly"]
  schedule = "0 16 * * 5"
