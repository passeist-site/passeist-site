[build]
  publish = "."
  functions = "netlify/functions"

[[plugins]]
  package = "./netlify/plugins/generate-product-pages"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Newsletter « Les nouveautés du dimanche » : dimanche 17 h (heure de Paris, été ; 16 h l'hiver)
[functions."newsletter-send"]
  schedule = "0 15 * * 0"

# Notification « nouveautés de la semaine » : dimanche 17 h, avec la newsletter
[functions."newsletter-preview"]
  schedule = "0 16 * * 6"   # aperçu à valider : samedi 18 h (Paris, été)

[functions."push-weekly"]
  schedule = "0 15 * * 0"
