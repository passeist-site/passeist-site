[build]
  publish = "."
  functions = "netlify/functions"

[[plugins]]
  package = "./netlify/plugins/generate-product-pages"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Newsletter : plus d'envoi automatique, Tom l'envoie quand il veut depuis la
# messagerie (« Envoyer maintenant »). Ce passage hebdomadaire ne fait que garder
# la clé Brevo active et y ajouter les abonnés.
[functions."newsletter-send"]
  schedule = "0 15 * * 0"

[functions."push-weekly"]
  schedule = "0 15 * * 0"
