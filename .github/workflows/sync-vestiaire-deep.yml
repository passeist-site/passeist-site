name: Sync Vestiaire — Deep (vérif systématique)

# Run cette deep sync manuellement (~10-15 min) quand tu veux chasser les
# articles supprimés sur Vestiaire qui apparaissent encore comme URLs phantoms
# dans la grille for-sale. Le sync normal (5 min) ne fait pas cette vérif.
# Tourne aussi automatiquement 1x/jour à 04:00 UTC (06:00 Paris).

on:
  schedule:
    - cron: '0 4 * * *'   # 1x/jour à 06h Paris : détection des suppressions
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deep-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + deps
        run: |
          pip install playwright cloudscraper pillow deep-translator
          playwright install --with-deps chromium

      - name: Run deep sync (vérif systématique parallèle de tous les items)
        id: sync
        env:
          SYNC_REPORT_DIR: /tmp/sync_reports
          DECODO_USER: ${{ secrets.DECODO_USER }}
          DECODO_PASS: ${{ secrets.DECODO_PASS }}
          DEEP_SYNC: '1'
        run: |
          python tools/synchro_vestiaire.py | tee /tmp/sync.log
          REPORT=$(grep -oP 'Rapport enregistré → \K\S+' /tmp/sync.log | tail -1)
          echo "report=$REPORT" >> $GITHUB_OUTPUT

      - name: Upload report artifact
        if: steps.sync.outputs.report
        uses: actions/upload-artifact@v4
        with:
          name: deep-sync-report-${{ github.run_id }}
          path: ${{ steps.sync.outputs.report }}
          retention-days: 30

      - name: Auto-bascule SOLD pour B (vendus VC) + D1 (absents VC)
        id: bascule
        run: |
          python << 'PYEOF'
          import json, re, os, sys
          rep_path = "${{ steps.sync.outputs.report }}"
          if not rep_path or not os.path.exists(rep_path):
              print("Pas de rapport, skip"); sys.exit(0)
          with open(rep_path) as f: r = json.load(f)
          B = r.get('B', [])
          D1 = r.get('D1', [])
          fs_target = r.get('vc_stats', {}).get('target_fs', 0)
          fs_scanned = r.get('vc_stats', {}).get('for_sale', 0)
          fs_complete = fs_scanned >= fs_target if fs_target else False
          to_bascule = list(B)
          if fs_complete:
              to_bascule.extend(D1)
          if not to_bascule:
              print("Rien à basculer")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('count=0\n')
              sys.exit(0)
          with open('index.html') as f: html = f.read()
          m = re.search(r'(const SOLD_IDS = new Set\(\[)(.*?)(\]\);)', html, re.DOTALL)
          existing_ids = re.findall(r'"(\d+)"', m.group(2))
          existing_set = set(existing_ids)
          new_ids = [pid for pid in to_bascule if pid not in existing_set]
          ordered_ids = new_ids + existing_ids
          inside = '\n  ' + ',\n  '.join(f'"{i}"' for i in ordered_ids) + '\n'
          html = html.replace(m.group(0), m.group(1) + inside + m.group(3))
          with open('index.html', 'w') as f: f.write(html)
          print(f'OK : {len(new_ids)} nouveaux ids (B+D1)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'count={len(new_ids)}\n')
              f.write(f'ids={" ".join(to_bascule)}\n')
          PYEOF

      - name: Régénère products.json
        if: steps.bascule.outputs.count != '0' && steps.bascule.outputs.count != ''
        run: python tools/export_products.py

      - name: Commit + push
        if: steps.bascule.outputs.count != '0' && steps.bascule.outputs.count != ''
        run: |
          git config user.name "passeist-bot"
          git config user.email "bot@passeist.com"
          git add index.html netlify/functions/products.json
          git commit -m "deep-sync $(date -u +%Y-%m-%d_%H:%M) | sold: ${{ steps.bascule.outputs.count }}

          🤖 Deep sync (vérification systématique) via GitHub Actions
          IDs basculés : ${{ steps.bascule.outputs.ids }}"
          git push
