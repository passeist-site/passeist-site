name: Portraits (temporaire)
on:
  push:
    branches: [claude/zen-davinci-8wowml]
    paths: ['.github/workflows/portraits.yml']
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/zen-davinci-8wowml
          sparse-checkout: |
            marques
            .github
          sparse-checkout-cone-mode: false
      - name: Télécharge les 5 portraits hébergés ailleurs
        run: |
          mkdir -p img
          ok=0
          for f in comme-des-garcons fumito-ganryu issey-miyake junko-koshino yohji-yamamoto; do
            u=$(grep -o '<img src="https://[^"]*" alt="Portrait' marques/$f.html | head -1 | sed 's/<img src="//;s/" alt="Portrait//;s/&amp;/\&/g')
            [ -z "$u" ] && continue
            if curl -sfL --max-time 60 -A "Mozilla/5.0 (Macintosh)" -o img/portrait-$f.jpg "$u" && file img/portrait-$f.jpg | grep -qiE 'image|JPEG|PNG|WebP'; then
              esc=$(printf '%s' "$u" | sed 's/&/\\&amp;/g; s/[\/.?*[]/\\&/g')
              sed -i "s|<img src=\"$(printf '%s' "$u" | sed 's/&/\&amp;/g' | sed 's/[|.?*[]/\\&/g')\" alt=\"Portrait|<img src=\"/img/portrait-$f.jpg\" alt=\"Portrait|" marques/$f.html
              grep -q "/img/portrait-$f.jpg" marques/$f.html && ok=$((ok+1)) && echo "OK $f $(stat -c%s img/portrait-$f.jpg)"
            else echo "ECHEC $f $u"; rm -f img/portrait-$f.jpg; fi
          done
          echo "portraits: $ok"
          git config user.name "passeist-bot"; git config user.email "bot@passeist.com"
          git add --sparse img/portrait-*.jpg marques/*.html
          git commit -m "Pages Auteurs : portraits hébergés sur passeist.com" || exit 0
          for i in 1 2 3; do git push && break; git pull --rebase -q; done
