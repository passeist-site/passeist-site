name: Sync Vestiaire

on:
  schedule:
    # 3 fois par jour : 06:00, 12:00, 18:00 UTC (soit 08h, 14h, 20h heure Paris).
    # Possible grâce à js_scenario qui divise par 4 le coût d'un run.
    - cron: '0 6,12,18 * * *'
  workflow_dispatch: {}  # permet aussi le déclenchement manuel via l'UI GitHub

permissions:
  contents: write   # pour commit/push les bascules SOLD
  issues: write     # pour ouvrir des issues si D1 ou E détectés

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'  # supprime le warning Node 20 deprecation

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          # Sparse checkout : on n'extrait QUE ce qu'il faut pour la sync.
          # Le dossier img/ fait 1+ GB et n'est pas nécessaire (les imports écrivent dedans
          # mais fonctionnent sans qu'il soit présent : seuls les nouveaux fichiers sont écrits).
          # Gain : ~80s sur l'étape checkout.
          sparse-checkout: |
            tools/
            .github/
            netlify/
            index.html
            requirements.txt
            JOURNAL.md
            RULES.md
          sparse-checkout-cone-mode: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install Playwright + deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run sync (Playwright via ScrapingBee proxy)
        id: sync
        env:
          SYNC_REPORT_DIR: /tmp/sync_reports
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          python -u tools/synchro_vestiaire.py | tee /tmp/sync.log
          # Extrait la dernière ligne "Rapport enregistré → /path/to/json"
          REPORT=$(grep -oP 'Rapport enregistré → \K\S+' /tmp/sync.log | tail -1)
          echo "report=$REPORT" >> $GITHUB_OUTPUT
          echo "Report file: $REPORT"

      - name: Upload report artifact
        if: steps.sync.outputs.report
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.run_id }}
          path: ${{ steps.sync.outputs.report }}
          retention-days: 30

      - name: Auto-bascule SOLD pour B (vendus VC) + D1 (absents VC)
        id: bascule
        run: |
          python << 'PYEOF'
          import json, re, os, sys
          rep_path = "${{ steps.sync.outputs.report }}"
          if not rep_path or not os.path.exists(rep_path):
              print("Pas de rapport, skip"); sys.exit(0)
          with open(rep_path) as f: r = json.load(f)
          B = r.get('B', [])
          D1 = r.get('D1', [])
          # Vérifie que le scan for-sale était complet (sécurité anti-faux-positif sur D1)
          fs_target = r.get('vc_stats', {}).get('target_fs', 0)
          fs_scanned = r.get('vc_stats', {}).get('for_sale', 0)
          fs_complete = fs_scanned >= fs_target if fs_target else False
          # B = bascule sûre. D1 = bascule sûre uniquement si scan for-sale complet
          to_bascule = list(B)
          d1_skipped = []
          if fs_complete:
              to_bascule.extend(D1)
              print(f'B={len(B)} + D1={len(D1)} → {len(to_bascule)} items à basculer (scan for-sale complet)')
          else:
              d1_skipped = D1
              print(f'B={len(B)} bascule. D1={len(D1)} skip (scan for-sale partiel {fs_scanned}/{fs_target})')
          if not to_bascule:
              print("Rien à basculer")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('count=0\n'); f.write('d1_skipped=\n')
              sys.exit(0)
          # Read index.html
          with open('index.html') as f: html = f.read()
          # Parse SOLD_IDS Set en préservant l'ORDRE d'arrivée
          # (cf TASKS.md : nouveaux SOLD en haut = plus récents en premier dans /archive)
          m = re.search(r'(const SOLD_IDS = new Set\(\[)(.*?)(\]\);)', html, re.DOTALL)
          existing_ids = re.findall(r'"(\d+)"', m.group(2))
          existing_set = set(existing_ids)
          before = len(existing_ids)
          # Nouveaux IDs ajoutés AU DÉBUT (= plus récents en premier)
          new_ids = [pid for pid in to_bascule if pid not in existing_set]
          ordered_ids = new_ids + existing_ids  # nouveaux d'abord, puis les anciens dans l'ordre existant
          inside = '\n  ' + ',\n  '.join(f'"{i}"' for i in ordered_ids) + '\n'
          html = html.replace(m.group(0), m.group(1) + inside + m.group(3))
          # Validation : aucune paire d'IDs sans virgule
          test = re.search(r'(const SOLD_IDS = new Set\(\[)(.*?)(\]\);)', html, re.DOTALL)
          if re.search(r'"\d+"\s*\n\s*"\d+"', test.group(2)):
              print('ERREUR : virgule manquante détectée, abort')
              sys.exit(1)
          with open('index.html', 'w') as f: f.write(html)
          added = len(new_ids)
          print(f'OK : {added} nouveaux ids dans SOLD_IDS (B+D1 dédoublonné)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'count={added}\n')
              f.write(f'ids={" ".join(to_bascule)}\n')
              f.write(f'd1_skipped={" ".join(d1_skipped)}\n')
          PYEOF

      - name: Auto-import des nouvelles pièces (E + C)
        id: import_e
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          python << 'PYEOF'
          import json, os, subprocess, sys
          rep_path = "${{ steps.sync.outputs.report }}"
          if not rep_path or not os.path.exists(rep_path):
              print("Pas de rapport, skip"); sys.exit(0)
          with open(rep_path) as f: r = json.load(f)
          # Concatène E + C — relistings traités comme nouvelles pièces (autre exemplaire vintage)
          E = (r.get('E', []) or []) + (r.get('C', []) or [])
          if not E:
              print("E + C vide, rien à importer")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('imported=0\n'); f.write('failed_unsigned=\n'); f.write('failed_other=\n')
              sys.exit(0)
          # IMPORTS SÉQUENTIELS (race condition fatale en parallèle, R14)
          imported = []
          failed_unsigned = []
          failed_other = []
          for item in E:
              pid = item['id']; url = item['url']
              print(f'\n=== Import {pid} ===')
              ret = subprocess.run(['python3', 'tools/import_vestiaire.py', pid, url],
                                   capture_output=False)
              if ret.returncode == 0:
                  imported.append(pid)
              elif ret.returncode == 2:
                  failed_unsigned.append(item)
              elif ret.returncode == 4:
                  print(f'{pid} déjà présent, skip')
              else:
                  failed_other.append({'id': pid, 'url': url, 'code': ret.returncode})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'imported={len(imported)}\n')
              f.write(f'imported_ids={" ".join(imported)}\n')
              f.write(f'failed_unsigned={json.dumps(failed_unsigned)}\n')
              f.write(f'failed_other={json.dumps(failed_other)}\n')
          print(f'\nRésumé : {len(imported)} importés, {len(failed_unsigned)} NON SIGNÉ skip, {len(failed_other)} autres erreurs')
          PYEOF

      - name: Régénère products.json (source de vérité prix serveur)
        if: (steps.bascule.outputs.count != '0' && steps.bascule.outputs.count != '') || (steps.import_e.outputs.imported != '0' && steps.import_e.outputs.imported != '')
        run: |
          python tools/export_products.py

      - name: Commit + push (bascules SOLD + imports + products.json)
        if: (steps.bascule.outputs.count != '0' && steps.bascule.outputs.count != '') || (steps.import_e.outputs.imported != '0' && steps.import_e.outputs.imported != '')
        run: |
          git config user.name "passeist-bot"
          git config user.email "bot@passeist.com"
          # Toujours add index.html + products.json (présents)
          git add --sparse index.html netlify/functions/products.json
          # img/ seulement s'il existe et contient des fichiers (imports faits)
          if [ -d img ] && [ -n "$(ls -A img/ 2>/dev/null)" ]; then
            git add --sparse img/
          fi
          MSG="auto-sync $(date -u +%Y-%m-%d_%H:%M)"
          if [ "${{ steps.bascule.outputs.count }}" != "0" ] && [ -n "${{ steps.bascule.outputs.count }}" ]; then
            MSG="$MSG | sold: ${{ steps.bascule.outputs.count }}"
          fi
          if [ "${{ steps.import_e.outputs.imported }}" != "0" ] && [ -n "${{ steps.import_e.outputs.imported }}" ]; then
            MSG="$MSG | imports: ${{ steps.import_e.outputs.imported }}"
          fi
          git commit -m "$MSG

          🤖 Généré automatiquement par GitHub Actions sync-vestiaire
          SOLD bascule IDs: ${{ steps.bascule.outputs.ids }}
          Imports IDs: ${{ steps.import_e.outputs.imported_ids }}"
          # Pull --rebase pour gérer les commits concurrents (autre run cron / manuel
          # qui aurait pushé pendant qu'on tournait). Retry le push 3 fois si échec.
          for i in 1 2 3; do
            if git push; then break; fi
            echo "Push rejeté (autre run a pushé), pull --rebase puis retry..."
            git pull --rebase origin main
            sleep 2
          done

      - name: Ouvre Issue si D1, NON SIGNÉ sans brand, ou erreurs d'import
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = "${{ steps.sync.outputs.report }}";
            if (!reportPath || !fs.existsSync(reportPath)) {
              console.log('Pas de rapport, skip issue');
              return;
            }
            const r = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const D1 = r.D1 || [];
            const importedCount = parseInt("${{ steps.import_e.outputs.imported }}" || "0");
            const importedIds = "${{ steps.import_e.outputs.imported_ids }}";
            let failedUnsigned = [], failedOther = [];
            try { failedUnsigned = JSON.parse(`${{ steps.import_e.outputs.failed_unsigned }}` || '[]'); } catch (e) {}
            try { failedOther = JSON.parse(`${{ steps.import_e.outputs.failed_other }}` || '[]'); } catch (e) {}
            const sold = parseInt("${{ steps.bascule.outputs.count }}" || "0");

            // Si rien à signaler ET rien à reporter, skip
            if (D1.length === 0 && failedUnsigned.length === 0 && failedOther.length === 0 && sold === 0 && importedCount === 0) {
              console.log('Rien à signaler');
              return;
            }

            let body = `# Sync Vestiaire ${new Date().toISOString().slice(0,16)}\n\n`;
            body += `**Stats** :\n- Site : ${r.site_stats.all} produits, ${r.site_stats.sold} SOLD, ${r.site_stats.available} dispo\n`;
            body += `- VC : ${r.vc_stats.for_sale} for-sale (target ${r.vc_stats.target_fs}), ${r.vc_stats.sold} vendus visibles\n\n`;

            // Actions auto déjà effectuées
            if (sold > 0 || importedCount > 0) {
              body += `## ✅ Actions automatiques effectuées\n\n`;
              if (sold > 0) body += `- **${sold} bascules SOLD** : ${("${{ steps.bascule.outputs.ids }}").split(' ').map(id => `\`${id}\``).join(', ')}\n`;
              if (importedCount > 0) body += `- **${importedCount} nouvelles pièces importées** : ${importedIds.split(' ').map(id => `\`${id}\``).join(', ')}\n`;
              body += `\n`;
            }

            // Actions à valider manuellement
            const needsAction = D1.length > 0 || failedUnsigned.length > 0 || failedOther.length > 0;
            if (needsAction) {
              body += `## ⚠ Actions à valider manuellement\n\n`;

              // D1 n'apparait dans l'Issue QUE s'il a été skip (= scan for-sale partiel)
              const d1Skipped = ("${{ steps.bascule.outputs.d1_skipped }}" || "").split(' ').filter(Boolean);
              if (d1Skipped.length > 0) {
                body += `### 🔴 D1 — Items absents du profil VC (scan partiel, validation manuelle)\n\n`;
                body += `${d1Skipped.length} items à vérifier (scan for-sale incomplet, bascule auto désactivée par sécurité) :\n\n`;
                d1Skipped.forEach(id => body += `- \`${id}\`\n`);
                body += `\n→ Vérifier chaque fiche Vestiaire puis dire à Claude dans Cowork "bascule SOLD <ID>".\n\n`;
              }

              if (failedUnsigned.length > 0) {
                body += `### 🟡 NON SIGNÉ sans brand détectable — import skippé\n\n`;
                body += `${failedUnsigned.length} items où la marque n'a pas pu être extraite de la description :\n\n`;
                failedUnsigned.forEach(e => body += `- \`${e.id}\` — ${e.url}\n`);
                body += `\n→ Vérifier la fiche Vestiaire et importer manuellement avec brand correcte via Cowork.\n\n`;
              }

              if (failedOther.length > 0) {
                body += `### 🔥 Erreurs d'import (proxy, photos, etc.)\n\n`;
                failedOther.forEach(e => body += `- \`${e.id}\` (code ${e.code}) — ${e.url}\n`);
                body += `\n→ Voir les logs du run : ${context.payload.repository.html_url}/actions/runs/${context.runId}\n\n`;
              }
            }

            body += `\n---\n_Généré automatiquement par GitHub Actions sync-vestiaire_`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔄 Sync ${new Date().toISOString().slice(0,16)} — ${sold} sold, ${importedCount} import, ${D1.length} D1${failedUnsigned.length > 0 ? `, ${failedUnsigned.length} non-signé` : ''}`,
              body: body,
              labels: ['sync-auto']
            });
            console.log('Issue créée');
