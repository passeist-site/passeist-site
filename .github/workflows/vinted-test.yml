name: Diagnostic vente (temporaire)
on:
  push:
    branches: [claude/zen-davinci-8wowml]
    paths: ['.github/workflows/vinted-test.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -sS -m 30 https://passeist.com/.netlify/functions/sold-ids | python3 -c "
          import json,sys; d=json.load(sys.stdin); print(type(d).__name__)
          items = d if isinstance(d, list) else d.get('ids', d)
          print(json.dumps(items)[:1500])"
