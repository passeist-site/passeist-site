name: Import photos manquantes (CDN Vestiaire -> passeist.com)

# Rapatrie sur passeist.com les photos des pièces en vente encore affichées
# depuis le CDN Vestiaire (cf tools/import_missing_photos.py). Déclenchement
# manuel uniquement : Actions > « Import photos manquantes » > Run workflow.

on:
  # Petits lots automatiques toutes les 20 min : le CDN Vestiaire bloque au-delà
  # d'une quinzaine de photos d'affilée. Sans pièce à traiter, le lot ne fait rien.
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Nombre max de pièces à traiter par lancement (0 = toutes ; 40 conseillé pour des envois de taille raisonnable)'
        default: '40'

concurrency:
  group: sync-vestiaire   # même groupe que la synchro : jamais en parallèle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (sans le dossier img/, trop lourd)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/
            index.html
            requirements.txt
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install pillow requests

      - name: Import des photos
        id: imp
        run: python -u tools/import_missing_photos.py --limit "${{ github.event.inputs.limit || '3' }}" --ids-out /tmp/imported_ids.txt

      - name: Commit + push
        if: steps.imp.outputs.imported != '0'
        # [skip netlify] : pas de reconstruction du site à chaque petit lot (quota
        # de build) ; les photos sont publiées avec la mise en ligne suivante.
        # Le Sync peut avoir modifié index.html pendant l'import : on repart
        # toujours du main distant, on y réapplique seulement l'ajout des ids
        # (pas de rebase, donc pas de conflit), les photos restent sur le disque.
        run: |
          git config user.name "passeist-bot"
          git config user.email "bot@passeist.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q origin/main
            git checkout origin/main -- index.html
            python tools/import_missing_photos.py --mark-only /tmp/imported_ids.txt
            git add --sparse index.html img/
            git commit -q -m "photos: ${{ steps.imp.outputs.imported }} pieces rapatriees du CDN Vestiaire sur passeist.com (${{ steps.imp.outputs.failed }} echecs) [skip netlify]"
            if git push -q origin HEAD:main; then echo "push OK"; exit 0; fi
            sleep $((i * 10))
          done
          exit 1
