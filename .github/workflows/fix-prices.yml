name: Fix Prices

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (ne pas ecrire index.html)'
        required: false
        default: 'false'
        type: boolean
      last:
        description: 'Verifier les N derniers articles (defaut: 30)'
        required: false
        default: '30'
      all_products:
        description: 'Verifier TOUS les produits (ignore last, couteux)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  fix-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Run fix_prices.py
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.all_products }}" = "true" ]; then
            ARGS="$ARGS --all"
          else
            ARGS="$ARGS --last ${{ github.event.inputs.last }}"
          fi
          python3 tools/fix_prices.py $ARGS

      - name: Commit corrections
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Aucun changement de prix" || git commit -m "fix: corrections prix via fix_prices.py [skip ci]"
          git push
