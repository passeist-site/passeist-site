name: Daily Digest

on:
  schedule:
    # 22h Paris peu importe DST (1h après le 2e sync de 21h pour qu'il finisse).
    # Cron déclenche à 20h UTC (été UTC+2) ET 21h UTC (hiver UTC+1).
    # Le step de check skip si l'heure Paris n'est pas 22h.
    - cron: '0 20,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  check-time:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      should_run: ${{ steps.tc.outputs.should_run }}
    steps:
      - id: tc
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT; exit 0
          fi
          H=$(TZ='Europe/Paris' date +%H)
          echo "Heure Paris : ${H}h"
          if [ "$H" = "22" ]; then echo "should_run=true" >> $GITHUB_OUTPUT
          else echo "should_run=false" >> $GITHUB_OUTPUT; fi

  digest:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (sparse, only tools/)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Send daily digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: python tools/daily_digest.py
